    configureTests {
        createSourceSet = true
        modId = 'riserecode-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}

def clientTestDirectory=providers.gradleProperty('clientTestDirectory').getOrElse('build/run/clientGameTest')
loom.runs.clientGameTest {
    runDir = clientTestDirectory
    vmArg '-Xmx1536m'
    vmArg '-XX:ActiveProcessorCount=4'
    programArgs '--graphicsBackend', providers.gradleProperty('graphicsBackend').getOrElse('OPENGL')
    if(providers.gradleProperty('remediationOnly').isPresent()) { vmArg '-Driserecode.remediationOnly=true';vmArg '-Driserecode.remediationEvidence='+file(providers.gradleProperty('remediationEvidence').getOrElse('upgrade-evidence/remediation')).absolutePath }
    for (key in ['lifetimeCycles','soakSeconds','performanceValidationOnly']) { if(providers.gradleProperty(key).isPresent()) { vmArg '-Driserecode.'+key+'='+providers.gradleProperty(key).get() } }
    if(providers.gradleProperty('remediationBaseline').isPresent()) { vmArg '-Driserecode.remediationBaseline=true' }
    if(providers.gradleProperty('cameraFovOnly').isPresent()) { vmArg '-Driserecode.cameraFovOnly=true' }
    if(providers.gradleProperty('guiPerformanceOnly').isPresent()) {
        vmArg '-Driserecode.guiPerformanceOnly=true'
        for (key in ['guiEvidence','guiValidationOnly','guiProfile','guiProfileScene','guiReferenceNoVignette','guiReferenceSettledMenus','guiAblation','guiLabel']) {
            if(providers.gradleProperty(key).isPresent()) { vmArg '-Driserecode.'+key+'='+providers.gradleProperty(key).get() }
        }
        vmArg '-Xmx4G'
        vmArg '-XX:ActiveProcessorCount=8'
    }
    if (providers.gradleProperty('benchmarkOnly').isPresent()) { vmArg '-Driserecode.benchmarkOnly=true'; vmArg '-Driserecode.benchmarkLabel=' + providers.gradleProperty('benchmarkLabel').getOrElse('baseline') }
    if (providers.gradleProperty('resourcesOffline').isPresent()) { vmArg '-Driserecode.resourcesOffline=true' }
    if (providers.gradleProperty('cosmeticsOnline').isPresent()) { vmArg '-Driserecode.cosmeticsOnline=true' }
    if (providers.gradleProperty('release020Only').isPresent()) { vmArg '-Driserecode.release020Only=true' }
    if (providers.gradleProperty('release019Only').isPresent()) { vmArg '-Driserecode.release019Only=true' }
    if (providers.gradleProperty('skipPlacementBenchmark').isPresent()) { vmArg '-Driserecode.skipPlacementBenchmark=true' }
    if (providers.gradleProperty('font025Reference').isPresent()) { vmArg '-Driserecode.font025Reference=true' }
    if (providers.gradleProperty('seedCrackerOnly').isPresent()) { vmArg '-Driserecode.seedCrackerOnly=true' }
    if (providers.gradleProperty('seedCrackerRecovery').isPresent()) { vmArg '-Driserecode.seedCrackerRecovery=true' }
    if (providers.gradleProperty('glassOnly').isPresent()) { vmArg '-Driserecode.glassOnly=true' }
    if (providers.gradleProperty('panoramaOnly').isPresent()) { vmArg '-Driserecode.panoramaOnly=true' }
    if (providers.gradleProperty('release025Only').isPresent()) { vmArg '-Driserecode.release025Only=true' }
    if (providers.gradleProperty('release023Only').isPresent()) { vmArg '-Driserecode.release023Only=true' }
    if (providers.gradleProperty('release022Only').isPresent()) { vmArg '-Driserecode.release022Only=true' }
    if (providers.gradleProperty('release021Only').isPresent()) { vmArg '-Driserecode.release021Only=true' }
    if (providers.gradleProperty('testShaderPack').isPresent()) { vmArg '-Driserecode.testShaderPack=' + providers.gradleProperty('testShaderPack').get() }
    if (providers.gradleProperty('blockOverlayOnly').isPresent()) { vmArg '-Driserecode.blockOverlayOnly=true' }
    if (providers.gradleProperty('cosmeticsOnly').isPresent()) { vmArg '-Driserecode.cosmeticsOnly=true' }
    if (providers.gradleProperty('capePhysicsOnly').isPresent()) { vmArg '-Driserecode.capePhysicsOnly=true' }
    if (providers.gradleProperty('baselineSmoke').isPresent()) { vmArg '-Driserecode.baselineSmoke=true' }
    if(providers.gradleProperty('blur017Only').isPresent()){vmArg '-Driserecode.release017Only=true';vmArg '-Driserecode.blur017Only=true';vmArg '-Driserecode.benchmarkLabel='+providers.gradleProperty('benchmarkLabel').getOrElse('vanilla')}
    if(providers.gradleProperty('release017Only').isPresent()){vmArg '-Driserecode.release017Only=true'}
    if(providers.gradleProperty('ui017Only').isPresent()){vmArg '-Driserecode.release017Only=true';vmArg '-Driserecode.ui017Only=true'}
    if (providers.gradleProperty('uiRepairOnly').isPresent()) { vmArg '-Driserecode.uiRepairOnly=true' }
    if (providers.gradleProperty('release016Only').isPresent()) { vmArg '-Driserecode.release016Only=true' }
    if (providers.gradleProperty('utilitiesOnly').isPresent()) { vmArg '-Driserecode.utilitiesOnly=true' }
    if (providers.gradleProperty('resourcesOnly').isPresent()) { vmArg '-Driserecode.resourcesOnly=true' }
    if (providers.gradleProperty('upgradeOnly').isPresent()) { vmArg '-Driserecode.upgradeOnly=true' }
    if (providers.gradleProperty('noRenderOnly').isPresent()) { vmArg '-Driserecode.noRenderOnly=true' }
    if (providers.gradleProperty('chunkAnimationsOnly').isPresent()) { vmArg '-Driserecode.chunkAnimationsOnly=true' }
    if (providers.gradleProperty('withShaderPack').isPresent()) { vmArg '-Driserecode.withShaderPack=true' }
