// The test instance is disposable. Copy only optional, user-installed font assets after cleanup;
// they remain local to development and never enter either distributable JAR.
tasks.named('runClientGameTest') {
    doFirst {
        if (providers.gradleProperty('resourcesOnly').isPresent() || providers.gradleProperty('remediationOnly').isPresent() || providers.gradleProperty('release016Only').isPresent()) {
            copy { from providers.gradleProperty('resourcesCacheDir').getOrElse('.tooling/resources-cache/26.2'); into clientTestDirectory+'/config/riserecode/resources/26.2' }
        }
        if (providers.gradleProperty('withEntityFeatures').isPresent()) { copy { from fileTree('dependencies') { include 'entity_model_features-*.jar', 'entity_texture_features-*.jar' }; into clientTestDirectory+'/mods' } }
        if (providers.gradleProperty('withBaritone').isPresent()) { copy { from 'dependencies/baritone-api-fabric-1.19.0.jar'; into clientTestDirectory+'/mods' } }
        if (providers.gradleProperty('withShaderPack').isPresent()) { copy { from providers.gradleProperty('testShaderPacksDir').getOrElse('/home/toast/.local/share/ModrinthApp/profiles/Fabric 26.2/shaderpacks') + '/' + providers.gradleProperty('testShaderPack').getOrElse('ComplementaryUnbound_r5.9.3.zip'); into clientTestDirectory+'/shaderpacks' } }
        if (providers.gradleProperty('rendererStack').isPresent()) { copy { from fileTree('dependencies') { include 'sodium-fabric-*.jar'; if (!providers.gradleProperty('withoutIris').isPresent()) { include 'iris-fabric-*.jar' } }; into clientTestDirectory+'/mods' } }
        if (providers.gradleProperty('installedStack').isPresent()) {
            copy {
                from providers.gradleProperty('installedModsDir').getOrElse('/home/toast/.local/share/ModrinthApp/profiles/Fabric 26.2/mods')
                exclude 'fabric-api-*', 'riserecode-*', 'baritone-*'
                if (providers.gradleProperty('withoutIris').isPresent()) { exclude 'iris-*' }
                into clientTestDirectory+'/mods'
            }
        }
        if(!providers.gradleProperty('bundledFontsOnly').isPresent()){
        copy {
            from providers.gradleProperty('testQraftysPack').getOrElse('run/resourcepacks/qraftys-capitalized-font.zip')
            into clientTestDirectory+'/resourcepacks'
        }
        copy {
            from 'run/config/riserecode/fonts'
            include '*.ttf', 'qraftys.zip'
            into clientTestDirectory+'/config/riserecode/fonts'
        }
        }
    }
}

