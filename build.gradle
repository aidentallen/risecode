plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    // Resolve the checksum-verified local libraries as modules so Loom can
    // generate Fabric metadata for their nested release JARs, including offline.
    exclusiveContent {
        forRepository { flatDir { dirs 'dependencies' } }
        filter {
            includeGroup 'de.javagl'
            includeGroup 'com.seedfinding'
            includeGroup 'com.fasterxml.jackson.core'
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    def cosmeticsLibraries = [
        'de.javagl:jgltf-model:2.0.4',
        'de.javagl:jgltf-impl-v1:2.0.4',
        'de.javagl:jgltf-impl-v2:2.0.4',
        'com.fasterxml.jackson.core:jackson-core:2.22.4',
        'com.fasterxml.jackson.core:jackson-databind:2.22.4',
        'com.fasterxml.jackson.core:jackson-annotations:2.22'
    ]
    cosmeticsLibraries.each { library ->
        implementation(library) { transitive = false }
        include(library) { transitive = false }
    }
    def seedLibraries = new groovy.json.JsonSlurper().parse(file('dependencies/manifest.json')).dependencies.findAll { it.file.startsWith('mc_') || it.file.startsWith('latticg-') }
    seedLibraries.each { entry ->
        def split = entry.file.substring(0, entry.file.length()-4).lastIndexOf('-')
        def coordinate = "com.seedfinding:${entry.file.substring(0, split)}:${entry.file.substring(split+1, entry.file.length()-4)}"
        implementation(coordinate) { transitive = false }
        include(coordinate) { transitive = false }
    }
    compileOnly files('dependencies/bbe-fabric-1.3.9+mc26.2-mod.jar')
    compileOnly files('dependencies/baritone-api-fabric-1.19.0.jar')
    // Optional renderer adapters target the installed versions; these are not bundled.
    compileOnly files('dependencies/sodium-fabric-0.9.2+mc26.2.jar', 'dependencies/iris-fabric-1.11.4+mc26.2.jar', 'dependencies/glsl-transformer-3.0.0-pre3.jar')
    compileOnly 'com.google.errorprone:error_prone_annotations:2.48.0'
    testCompileOnly 'com.google.errorprone:error_prone_annotations:2.48.0'
}

processResources {
    from('LICENSE') { into 'licenses'; rename { 'risecode-MIT.txt' } }
    from('THIRD_PARTY_NOTICES.md') { into 'licenses' }
    from('licenses') { into 'licenses' }
    from('credits.txt') { into 'licenses' }
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

