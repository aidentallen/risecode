name: Verify source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch pinned dependencies and run checks
        run: python3 scripts/verify-project.py
      - name: Preserve actual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: build/verification/
